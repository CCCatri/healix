name: demo
on: [push, pull_request]
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: demo on the tracked fixture
        run: npm run demo -- tests
      - name: check every proposed pair against the fixture's construction
        run: npm run check
      - uses: actions/upload-artifact@v4
        with: { name: demo_pairs, path: out/demo_pairs.tsv }
